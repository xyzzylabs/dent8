name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      # The workspace is kept clippy-clean; treat any warning as an error in CI.
      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The Postgres adapter is feature-gated; compile-check + lint it too.
      - name: Clippy Postgres adapter
        run: cargo clippy -p dent8-store-postgres --features adapter --all-targets -- -D warnings
      # The CLI's Postgres backend is feature-gated; compile-check + lint it too.
      - name: Clippy CLI Postgres feature
        run: cargo clippy -p dent8 --features postgres --all-targets -- -D warnings
      # Signed source identity and the witness commands are always compiled into the CLI now, so
      # the default `cargo clippy --workspace` + `cargo test --workspace` cover them.
      # The asymmetric (signed) anchor is feature-gated; lint + test it too.
      - name: Clippy signed-anchor feature
        run: cargo clippy -p dent8-core --features signed-anchor --all-targets -- -D warnings
      # The CLI's Parquet export lane (arrow/parquet) is feature-gated; lint + test.
      - name: Clippy CLI export feature
        run: cargo clippy -p dent8 --features export --all-targets -- -D warnings
      # The embedded SQLite backend (sqlx) — the second async backend; lint + test (it runs
      # in-memory, no server needed, so its tests run in the default `cargo test --workspace`).
      - name: Clippy SQLite adapter
        run: cargo clippy -p dent8-store-sqlite --all-targets -- -D warnings
      - name: Clippy CLI SQLite feature
        run: cargo clippy -p dent8 --features sqlite --all-targets -- -D warnings
      # The minimal build (`--no-default-features` drops the SQLite/async backend down to the
      # file-only dev store): the docs advertise it, so keep it compiling + linting.
      - name: Clippy CLI no default features
        run: cargo clippy -p dent8 --no-default-features --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace
      # The minimal file-only build (no async backend); its store-selection paths run here.
      - name: Test CLI no default features
        run: cargo test -p dent8 --no-default-features
      # The stock binary includes the witness, so this exercises the witness smoke too.
      - name: Release acceptance smoke
        run: scripts/release-acceptance.sh
      - name: Test signed-anchor feature
        run: cargo test -p dent8-core --features signed-anchor
      - name: Test export crate
        run: cargo test -p dent8-export

  postgres:
    name: Postgres adapter + CLI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dent8
          POSTGRES_DB: dent8
        ports:
          - 5432:5432
        # Gate the job on the DB actually accepting connections.
        options: >-
          --health-cmd "pg_isready -U postgres -d dent8"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # The adapter's integration tests run only when DATABASE_URL is set (they skip
      # otherwise — see crates/dent8-store-postgres/src/adapter.rs).
      DATABASE_URL: postgres://postgres:dent8@localhost:5432/dent8
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The CLI/MCP-over-Postgres path itself (not just the adapter crate): build it and run a
      # live end-to-end assert -> supersede -> explain -> verify, so the runnable Postgres
      # surface is regression-covered. Run it first against the fresh service database; the
      # adapter tests below intentionally create several same-predicate fixtures that are useful
      # at the storage layer but should not pollute the product-level verifier smoke.
      - name: Build CLI with Postgres feature
        run: cargo build -p dent8 --features postgres
      - name: CLI end-to-end over live Postgres
        env:
          DENT8_STORE_URL: postgres://postgres:dent8@localhost:5432/dent8
        run: |
          set -euo pipefail
          BIN=target/debug/dent8
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          export DENT8_AUTHORITY="$tmpdir/authority.json"
          "$BIN" authority add source:ci high
          "$BIN" assert person:ci-e2e favorite_drink tea --authority high --source source:ci
          "$BIN" supersede person:ci-e2e favorite_drink coffee --authority high --source source:ci
          output="$("$BIN" explain person:ci-e2e favorite_drink)"
          printf '%s\n' "$output"
          grep -q 'value         : "coffee"' <<< "$output"
          "$BIN" verify
      # The integration tests share one database; they self-serialize (a process-static
      # mutex) and retry the initial connection, so no special flags are needed. Each test
      # truncates the log + materialized caches before it runs.
      - name: Test CLI concurrent writes over live Postgres
        run: cargo test -p dent8 --features postgres --test cli_usage concurrent_cli_asserts_on_shared_postgres_store_get_unique_event_ids
      - name: Test Postgres adapter
        run: cargo test -p dent8-store-postgres --features adapter

  # Build the operational Docker image (Postgres + SQLite + witness) and smoke it. This is
  # what examples/witness-operated/ composes; keeping it green here means the packaged
  # witness split is always buildable.
  docker:
    name: docker image build + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dent8:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke the binary
        run: |
          docker run --rm dent8:ci --version
          docker run --rm dent8:ci witness doctor writer || test $? -eq 1
      - name: Validate the operated-witness compose file
        run: docker compose -f examples/witness-operated/compose.yml config --quiet

  # Bounded libFuzzer smoke over the attacker-exposed deserialize -> fold -> canonicalize path
  # (fuzz/fuzz_targets/). 60s per target: enough to re-run the corpus + catch shallow
  # regressions on every push; long exploratory runs stay a local/manual concern.
  fuzz:
    name: fuzz smoke (nightly, bounded)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build fuzz targets
        run: cargo fuzz build
      - name: Fuzz deserialize -> apply -> canonicalize
        run: cargo fuzz run deserialize_apply_canonicalize -- -max_total_time=60 -rss_limit_mb=4096
      - name: Fuzz CanonicalJson idempotency
        run: cargo fuzz run canonical_json -- -max_total_time=60 -rss_limit_mb=4096

  # A `cargo kani` CI job over the dent8-core proof harnesses was attempted but reverted: the
  # official kani-github-action's pinned nightly (Kani 0.67, nightly-2025-11-21) does not build
  # this edition-2024 workspace (`cargo` exits 101 with 0 compilation errors). The harnesses are
  # real (`#[cfg(kani)] #[kani::proof]` in dent8-core) and run manually with a local `cargo
  # kani`; wiring a green CI job is a tracked follow-up once a compatible toolchain is pinned.
