name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      operated_witness_demo:
        description: "Run the live operated-witness Docker Compose rollback demo"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      # The workspace is kept clippy-clean; treat any warning as an error in CI.
      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The Postgres adapter is feature-gated; compile-check + lint it too.
      - name: Clippy Postgres adapter
        run: cargo clippy -p dent8-store-postgres --features adapter --all-targets -- -D warnings
      # The CLI's Postgres backend is feature-gated; compile-check + lint it too.
      - name: Clippy CLI Postgres feature
        run: cargo clippy -p dent8-cli --features postgres --all-targets -- -D warnings
      # Signed source identity and the witness commands are always compiled into the CLI now, so
      # the default `cargo clippy --workspace` + `cargo test --workspace` cover them.
      # The asymmetric (signed) anchor is feature-gated; lint + test it too.
      - name: Clippy signed-anchor feature
        run: cargo clippy -p dent8-core --features signed-anchor --all-targets -- -D warnings
      # The CLI's Parquet export lane (arrow/parquet) is feature-gated; lint + test.
      - name: Clippy CLI export feature
        run: cargo clippy -p dent8-cli --features export --all-targets -- -D warnings
      # The embedded SQLite backend (sqlx) — the second async backend; lint + test (it runs
      # in-memory, no server needed, so its tests run in the default `cargo test --workspace`).
      - name: Clippy SQLite adapter
        run: cargo clippy -p dent8-store-sqlite --all-targets -- -D warnings
      - name: Clippy CLI SQLite feature
        run: cargo clippy -p dent8-cli --features sqlite --all-targets -- -D warnings
      # The minimal build (`--no-default-features` drops the SQLite/async backend down to the
      # file-only dev store): the docs advertise it, so keep it compiling + linting.
      - name: Clippy CLI no default features
        run: cargo clippy -p dent8-cli --no-default-features --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace
      # The minimal file-only build (no async backend); its store-selection paths run here.
      - name: Test CLI no default features
        run: cargo test -p dent8-cli --no-default-features
      # The stock binary includes the witness, so this exercises the witness smoke too.
      - name: Release acceptance smoke
        run: scripts/release-acceptance.sh
      - name: Test signed-anchor feature
        run: cargo test -p dent8-core --features signed-anchor
      - name: Test export crate
        run: cargo test -p dent8-export

  postgres:
    name: Postgres adapter + CLI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dent8
          POSTGRES_DB: dent8
        ports:
          - 5432:5432
        # Gate the job on the DB actually accepting connections.
        options: >-
          --health-cmd "pg_isready -U postgres -d dent8"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # The adapter's integration tests run only when DATABASE_URL is set (they skip
      # otherwise — see crates/dent8-store-postgres/src/adapter.rs).
      DATABASE_URL: postgres://postgres:dent8@localhost:5432/dent8
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The CLI/MCP-over-Postgres path itself (not just the adapter crate): build it and run a
      # live end-to-end assert -> supersede -> explain -> verify, so the runnable Postgres
      # surface is regression-covered. Run it first against the fresh service database; the
      # adapter tests below intentionally create several same-predicate fixtures that are useful
      # at the storage layer but should not pollute the product-level verifier smoke.
      - name: Build CLI with Postgres feature
        run: cargo build -p dent8-cli --features postgres
      - name: CLI end-to-end over live Postgres
        env:
          DENT8_STORE_URL: postgres://postgres:dent8@localhost:5432/dent8
        run: |
          set -euo pipefail
          BIN=target/debug/dent8
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          export DENT8_AUTHORITY="$tmpdir/authority.json"
          "$BIN" authority add source:ci high
          # Above-agent authority (medium/high/canonical) now requires a valid signed identity, so
          # provision one for source:ci and export its signing env before the High writes below.
          "$BIN" identity bootstrap --dir "$tmpdir/id" --source source:ci --max high --issuer-key "$tmpdir/issuer.key"
          export DENT8_TRUST="$tmpdir/id/trust.json"
          export DENT8_GRANT="$tmpdir/id/grants/source_ci.grant.json"
          export DENT8_IDENTITY_KEY="$tmpdir/id/identities/source_ci.key"
          export DENT8_ACTIVE_GRANTS="$tmpdir/id/active-grants.json"
          export DENT8_REQUIRE_IDENTITY=1
          "$BIN" assert person:ci-e2e favorite_drink tea --authority high --source source:ci
          "$BIN" supersede person:ci-e2e favorite_drink coffee --authority high --source source:ci
          output="$("$BIN" explain person:ci-e2e favorite_drink)"
          printf '%s\n' "$output"
          grep -q 'value         : "coffee"' <<< "$output"
          "$BIN" verify
      # The integration tests share one database; they self-serialize (a process-static
      # mutex) and retry the initial connection, so no special flags are needed. Each test
      # truncates the log + materialized caches before it runs.
      - name: Test CLI concurrent writes over live Postgres
        run: cargo test -p dent8-cli --features postgres --test cli_usage concurrent_cli_asserts_on_shared_postgres_store_get_unique_event_ids
      - name: Test Postgres adapter
        run: cargo test -p dent8-store-postgres --features adapter

  # The Windows keychain backend (`keychain:<account>` → Credential Manager) is the one
  # platform-specific piece with no other coverage: release builds compile Windows but never
  # lint or test it. Clippy the CLI for the platform and run the real Credential Manager
  # round trip (the runner's credential store works headlessly). `--no-default-features`
  # skips the bundled-sqlite C build; the always-on identity module is what matters here.
  windows-keychain:
    name: Windows keychain (Credential Manager)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy CLI for Windows
        run: cargo clippy -p dent8-cli --all-targets --no-default-features -- -D warnings
      - name: Credential Manager round trip
        run: cargo test -p dent8-cli --no-default-features --bin dent8 keychain

  # Build the operational Docker image (Postgres + SQLite + witness) and smoke it. This is
  # what examples/witness-operated/ composes; keeping it green here means the packaged
  # witness split is always buildable.
  python-sdk:
    name: Python SDK against the real binary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Build the dent8 binary
        run: cargo build -p dent8-cli
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Install with the `langchain` extra so both the core SDK tests and the first-class
      # `dent8.langchain` adapter tests run against the real binary.
      - name: Install the SDK (with the langchain extra) + pytest
        run: python -m pip install -q -e "sdks/python[langchain]" pytest
      # The SDK is a thin wrapper over the CLI's JSON contract, so the binary IS the unit
      # under test: these tests pin schema_version, status, error codes, and that the
      # LangChain tools carry firewall refusals back to the agent as results.
      - name: Run the SDK tests
        run: DENT8_BIN="$PWD/target/debug/dent8" python -m pytest -q sdks/python/tests

  node-sdk:
    name: TypeScript SDK against the real binary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Build the dent8 binary
        run: cargo build -p dent8-cli
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install, build, and test the SDK
        working-directory: sdks/typescript
        run: |
          npm ci
          DENT8_BIN="$GITHUB_WORKSPACE/target/debug/dent8" npm test

  docker:
    name: docker image build + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: dent8:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke the binary
        run: |
          docker run --rm dent8:ci --version
          docker run --rm dent8:ci witness doctor writer || test $? -eq 1
      - name: Validate the operated-witness compose file
        run: |
          bash -n examples/witness-operated/demo.sh
          docker compose -f examples/witness-operated/compose.yml config --quiet

  # Full live E2E for the operated witness deployment recipe. This builds the packaged image
  # through Compose, writes one Postgres-backed event, waits until the signer/publisher/monitor
  # split publishes a count-1 head, deletes the event log, and requires the monitor to alarm on
  # rollback. It is manual because it is heavier and exercises Docker Compose timing.
  operated-witness-demo:
    name: operated witness rollback E2E (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operated_witness_demo }}
    steps:
      - uses: actions/checkout@v5
      - name: Run operated-witness rollback demo
        run: ./examples/witness-operated/demo.sh

  # Bounded libFuzzer smoke over the attacker-exposed deserialize -> fold -> canonicalize path
  # (fuzz/fuzz_targets/). 60s per target: enough to re-run the corpus + catch shallow
  # regressions on every push; long exploratory runs stay a local/manual concern.
  fuzz:
    name: fuzz smoke (nightly, bounded)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build fuzz targets
        run: cargo fuzz build
      - name: Fuzz deserialize -> apply -> canonicalize
        run: cargo fuzz run deserialize_apply_canonicalize -- -max_total_time=60 -rss_limit_mb=4096
      - name: Fuzz CanonicalJson idempotency
        run: cargo fuzz run canonical_json -- -max_total_time=60 -rss_limit_mb=4096

  # A `cargo kani` CI job over the dent8-core proof harnesses was attempted but reverted: the
  # official kani-github-action's pinned nightly (Kani 0.67, nightly-2025-11-21) does not build
  # this edition-2024 workspace (`cargo` exits 101 with 0 compilation errors). The harnesses are
  # real (`#[cfg(kani)] #[kani::proof]` in dent8-core) and run manually with a local `cargo
  # kani`; wiring a green CI job is a tracked follow-up once a compatible toolchain is pinned.
