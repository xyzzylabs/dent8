# Prebuilt release binaries: build the operational CLI (postgres + sqlite + witness; export
# stays cargo-only — the arrow/parquet stack triples the binary for a niche lane) for the
# five first-class targets and attach the archives + checksums to the GitHub release for the
# pushed tag.
#
# Also runs on workflow_dispatch as a build-only smoke (upload steps are tag-guarded), so the
# matrix can be verified without cutting a release.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          # Intel macOS is cross-compiled from the arm runner: macos-13 (the last Intel
          # runner image) queues indefinitely as GitHub phases it out, and Apple's toolchain
          # cross-compiles x86_64 from arm natively. The smoke still executes via Rosetta.
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release -p dent8-cli --target ${{ matrix.target }} --features postgres,sqlite
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || version="dev"
          name="dent8-v${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/dent8.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/dent8" "dist/$name/"
          fi
          cp README.md LICENSE-APACHE LICENSE-MIT "dist/$name/"
          cd dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            archive="$name.zip"
            tar -a -cf "$archive" "$name"
          else
            archive="$name.tar.gz"
            tar -czf "$archive" "$name"
          fi
          openssl dgst -r -sha256 "$archive" > "$archive.sha256"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Smoke the binary
        if: matrix.os != 'windows-latest'
        run: |
          "target/${{ matrix.target }}/release/dent8" --version
      - name: Smoke the binary (windows)
        if: matrix.os == 'windows-latest'
        run: |
          & "target/${{ matrix.target }}/release/dent8.exe" --version
      # Upload only for real tag pushes; a workflow_dispatch run is a build smoke.
      - name: Ensure the release exists
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        # shell: bash is load-bearing — without it the Windows runner uses PowerShell, which
        # parses `>/dev/null` as a redirect to `D:\dev\null` and fails. (The Upload step below
        # already pins bash; this step was missed.)
        shell: bash
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --title "dent8 ${GITHUB_REF_NAME}" --generate-notes
      - name: Upload archive
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${GITHUB_REF_NAME}" "dist/${ARCHIVE}" "dist/${ARCHIVE}.sha256" --clobber

  # Tokenless SDK publishes via Trusted Publishing (OIDC): PyPI and npm each verify the
  # short-lived identity token this workflow mints per-run — no standing credential in
  # GitHub secrets or on any machine. Requires the matching trusted-publisher entry in the
  # registry UI (PyPI: project dent8 -> Publishing; npm: package dent8 -> Settings), naming
  # this repo, this workflow file, and the environment below. Tag-guarded so the
  # workflow_dispatch build smoke never publishes.
  pypi:
    name: publish dent8 to PyPI (trusted publishing)
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        working-directory: sdks/python
        run: |
          python -m pip install -q build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist

  npm:
    name: publish dent8 to npm (trusted publishing)
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      # Node 24 ships an npm new enough for OIDC trusted publishing (provenance included).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Build and publish
        working-directory: sdks/typescript
        run: |
          npm ci
          npm run build
          npm publish

  # crates.io via Trusted Publishing (OIDC) — the same tokenless model as PyPI and npm above:
  # rust-lang/crates-io-auth-action exchanges this run's OIDC identity for a short-lived
  # (~30-minute) crates.io token, so there is no standing CARGO_REGISTRY_TOKEN in GitHub
  # secrets or on any machine. Requires a Trusted Publisher entry on crates.io for EACH of the
  # eight workspace crates (each crate -> Settings -> Trusted Publishing), naming this repo,
  # this workflow file (release.yml), and the `crates-io` environment below; one token then
  # authorizes all of them. `cargo publish --workspace` computes the dependency order and waits
  # for each crate to index before publishing its dependents — no hand-maintained crate list.
  # Runs on tags to publish; also on workflow_dispatch as an OIDC auth smoke (the publish step
  # is tag-guarded), so the Trusted Publishing setup can be verified without cutting a release —
  # a successful auth step means every crate's Trusted Publisher entry matches. Same
  # build-smoke pattern the binaries job uses.
  crates:
    name: publish crates to crates.io (trusted publishing)
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Authenticate to crates.io (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      # Publish only on a real tag; a workflow_dispatch run stops after the auth smoke above.
      - name: Publish the workspace in dependency order
        if: github.ref_type == 'tag'
        run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
