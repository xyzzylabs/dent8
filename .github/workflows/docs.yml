# Build and deploy the docs site (website/ — Astro Starlight over docs/) to GitHub Pages.
# docs/ is the single source of truth: the site syncs it at build time, so any docs change
# on main redeploys the site. Requires Pages to be enabled with "GitHub Actions" as the
# source (repo Settings -> Pages) — a one-time setting.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "website/**"
      - "assets/logo.svg"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # Enables Pages (source: GitHub Actions) on first run, so no manual repo setting.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the site
        working-directory: website
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
