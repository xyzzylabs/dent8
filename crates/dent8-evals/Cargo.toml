[package]
name = "dent8-evals"
description = "Evaluation corpus for the dent8 memory firewall: adversarial scenarios, reviewed legitimate traffic, and modeled peer comparisons."
edition.workspace = true
license.workspace = true
readme.workspace = true
keywords = ["benchmark", "adversarial", "agent", "memory", "security"]
categories = ["development-tools::testing"]
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
name = "dent8_evals"
path = "src/lib.rs"

[dependencies]
dent8-core = { path = "../dent8-core", version = "0.8.0" }
dent8-store = { path = "../dent8-store", version = "0.8.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
