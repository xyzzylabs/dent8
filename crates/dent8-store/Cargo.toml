[package]
name = "dent8-store"
description = "Storage and replay boundaries for dent8 fact events."
edition.workspace = true
license.workspace = true
readme.workspace = true
keywords = ["event-sourcing", "storage", "memory", "agent", "firewall"]
categories = ["database", "development-tools"]
repository.workspace = true
rust-version.workspace = true
version.workspace = true
exclude = ["tests/**"]

[lib]
name = "dent8_store"
path = "src/lib.rs"

[dependencies]
dent8-core = { path = "../dent8-core", version = "0.3.1" }
# Opt-in: the `AsyncEventStore` trait for async (network/embedded-sqlx) backends. Boxed via
# `async-trait` so the CLI can hold a `Box<dyn AsyncEventStore>` selected at runtime. Off by
# default so the sync file/in-memory store pulls no async machinery.
async-trait = { version = "0.1", optional = true }

[features]
async-store = ["dep:async-trait"]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true

[package.metadata.docs.rs]
# docs.rs builds once per version; without this the feature-gated APIs vanish from the docs.
all-features = true
