[package]
name = "dent8-store-postgres"
description = "Postgres schema and adapter boundary for dent8."
edition.workspace = true
license.workspace = true
readme.workspace = true
keywords = ["postgres", "sqlx", "event-sourcing", "storage"]
categories = ["database"]
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
name = "dent8_store_postgres"
path = "src/lib.rs"

[dependencies]
dent8-core = { path = "../dent8-core", version = "0.7.2" }
dent8-store = { path = "../dent8-store", version = "0.7.2" }
serde_json = { version = "1", optional = true }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "json",
], optional = true }
async-trait = { version = "0.1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[features]
# The async sqlx adapter is opt-in so the schema string (and the CLI that prints it) does
# not pull the sqlx/serde_json dependency tree. Build/test the adapter with
# `--features adapter`. It also implements the backend-agnostic `AsyncEventStore` trait.
adapter = [
    "dep:sqlx",
    "dep:serde_json",
    "dep:async-trait",
    "dent8-store/async-store",
]

[lints]
workspace = true

[package.metadata.docs.rs]
# docs.rs builds once per version; without this the feature-gated APIs vanish from the docs.
all-features = true
