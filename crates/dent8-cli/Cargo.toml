[package]
name = "dent8"
description = "Command-line interface for dent8."
edition.workspace = true
license.workspace = true
readme.workspace = true
keywords = ["agent", "memory", "mcp", "provenance", "firewall"]
categories = ["command-line-utilities", "development-tools"]
repository.workspace = true
rust-version.workspace = true
version.workspace = true
exclude = ["tests/**"]

[[bin]]
name = "dent8"
path = "src/main.rs"

[dependencies]
dent8-core = { path = "../dent8-core", version = "0.1.0" }
dent8-store = { path = "../dent8-store", version = "0.1.0" }
dent8-store-postgres = { path = "../dent8-store-postgres", version = "0.1.0" }
# Default local backend: embedded SQLite (sqlx + bundled libsqlite3), selected by a sqlite:// URL.
dent8-store-sqlite = { path = "../dent8-store-sqlite", version = "0.1.0", optional = true }
# Pure logic over core/store (no extra heavy deps) — powers the self-demonstrating
# `dent8 eval` benchmark.
dent8-evals = { path = "../dent8-evals", version = "0.1.0" }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"
# Async backend bridge used by SQLite by default and by opt-in backends such as Postgres.
# This lets the CLI/MCP run against a backend selected by DENT8_STORE_URL.
tokio = { version = "1", features = ["rt", "net", "time"], optional = true }
# Default: Ed25519 source identity is part of the stock CLI because the secure onboarding
# path should not require a custom build. The witness command remains opt-in below.
ed25519-dalek = { version = "2", optional = true }
sha2 = { version = "0.10", optional = true }
getrandom = { version = "0.2", optional = true }
hex = { version = "0.4", optional = true }
# Opt-in: the `dent8 export` analytical lane (Parquet for DuckDB). Off by default so the stock
# binary stays free of the arrow/parquet columnar stack.
dent8-export = { path = "../dent8-export", version = "0.1.0", optional = true }

[features]
default = ["identity", "sqlite"]
# Umbrella enabled by every async backend: it brings in the `AsyncEventStore` trait + the
# tokio bridge, so the generic `connect_backend`/`backend_*` facade compiles. A backend
# feature (e.g. `postgres`) turns it on; selection is by URL scheme at runtime.
async-store = ["dent8-store/async-store", "dep:tokio"]
postgres = ["dent8-store-postgres/adapter", "async-store"]
sqlite = ["dep:dent8-store-sqlite", "async-store"]
identity = ["dep:ed25519-dalek", "dep:getrandom", "dep:hex", "dep:sha2"]
witness = ["dent8-core/signed-anchor", "dep:ed25519-dalek", "dep:getrandom", "dep:hex"]
export = ["dep:dent8-export"]

[lints]
workspace = true

[package.metadata.docs.rs]
# docs.rs builds once per version; without this the feature-gated APIs vanish from the docs.
all-features = true
