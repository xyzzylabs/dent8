[package]
name = "dent8-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
dent8-core = { path = "../crates/dent8-core" }
dent8-store = { path = "../crates/dent8-store" }

# Standalone: the fuzz crate is excluded from the main workspace so stable builds, clippy,
# and `cargo test` never pull in libFuzzer (which needs nightly).
[workspace]

[[bin]]
name = "deserialize_apply_canonicalize"
path = "fuzz_targets/deserialize_apply_canonicalize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "canonical_json"
path = "fuzz_targets/canonical_json.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
